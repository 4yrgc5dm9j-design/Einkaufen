services:
  alltag:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Berlin
      # Hinter HTTPS-Proxy (Caddy, Nginx, Traefik …):
      - TRUST_PROXY=1
      # Nur wer diesen Code kennt, kann sich registrieren (leer lassen = offen):
      - REGISTRATION_CODE=${REGISTRATION_CODE:-}
      - VAPID_CONTACT=mailto:du@example.com
    volumes:
      - ./data:/app/data
