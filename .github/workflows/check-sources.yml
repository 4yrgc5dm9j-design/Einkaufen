name: Rezeptquellen prüfen

on:
  workflow_dispatch:
  push:
    branches: [claude/alltags-app-rezepte-kalender-gr3pwt]
    paths: [scripts/check-sources.mjs]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-sources.mjs
